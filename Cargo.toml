[package]
name = "coffe-labs-backend"
version = "2.0.0"
edition = "2021"
authors = ["Coffee Labs Principal Systems Architecture Team"]
description = "Enterprise High-Performance Rust Axum Backend for Coffee Labs Mobile & Observability Dashboard"

[dependencies]
# Core & Async Runtime
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "compression-br",
    "compression-gzip",
    "limit",
    "timeout",
    "request-id",
    "catch-panic",
] }

# Memory Allocator, Concurrent Cache & Zero-Copy Optimization
mimalloc = { version = "0.1", default-features = false }
bytes = "1.9"
compact_str = { version = "0.8", features = ["serde"] }
dashmap = "6.1"
moka = { version = "0.12", features = ["future"] }
roaring = "0.10"
ulid = { version = "1.1", features = ["serde"] }
tokio-cron-scheduler = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

# Serverless Database (NeonDB Optimized)
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
] }

# Enterprise Security, Cryptography & Anti-Hack
argon2 = { version = "0.5", features = ["std"] }
bcrypt = "0.15"
jsonwebtoken = "9.3"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
data-encoding = "2.11"
hex = "0.4"
base64 = "0.22"
tower_governor = { version = "0.7", features = ["axum"] }
secrecy = { version = "0.10", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }
garde = { version = "0.20", features = ["derive"] }

# Serialization, Time & Identifiers
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
dotenvy = "0.15"
aho-corasick = "1.1"
regex = "1.11"
strsim = "0.11"
smallvec = { version = "1.13", features = ["serde"] }
rmp-serde = "1.3"
governor = "0.8"
rustrict = "0.7"
fred = { version = "9.3", features = ["subscriber-client", "serde-json", "partial-tracing", "enable-rustls", "i-scripts"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
lapin = { version = "2.5", default-features = false, features = ["rustls", "rustls-webpki-roots-certs"] }
futures-lite = "2.6"

# Observability, OpenAPI & Structured Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
utoipa = { version = "5.3", features = ["axum_extras", "uuid", "chrono"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
